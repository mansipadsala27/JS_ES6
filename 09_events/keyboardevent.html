<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form action="">
        key down : <input type="text" onkeydown="keyDown()">
       <br><br> key up : <input type="text" onkeyup="keyUp()">

    </form>
    <h1 id="cnt"></h1>
    <script>
        let cnt=0
       let keyDown=()=>
      {
        cnt++
        document.getElementById("cnt").innerHTML=cnt
      } 

      let cnt1=0
       let keyUp=()=>
      {
        cnt1++
        document.getElementById("cnt").innerHTML=cnt1
      } 
    </script>
</body>
</html>
