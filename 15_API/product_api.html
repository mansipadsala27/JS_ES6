<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-7xl mx-auto py-10 px-5">

    <h1 class="text-4xl font-bold text-center text-indigo-700 mb-10">
        🛍️ Product Store
    </h1>

    <div id="product-table" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">

    </div>

</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>

$.ajax({
    method:'GET',
    url:'https://dummyjson.com/products',

    success:function(data){

        let products=data.products;
        let result="";

        products.map((v)=>{

            result+=`
            
            <div class="bg-white rounded-2xl shadow-lg hover:shadow-2xl hover:-translate-y-2 transition duration-300 overflow-hidden">

                <img src="${v.thumbnail}"
                     class="w-full h-52 object-cover">

                <div class="p-5">

                    <span class="bg-indigo-100 text-indigo-700 text-xs px-3 py-1 rounded-full">
                        ${v.category}
                    </span>

                    <h2 class="text-xl font-bold mt-3">
                        ${v.title}
                    </h2>

                    <p class="text-gray-600 text-sm mt-2 line-clamp-3">
                        ${v.description}
                    </p>

                    <div class="flex justify-between mt-4">
                        <span class="text-2xl font-bold text-green-600">
                            $${v.price}
                        </span>

                        <span class="text-yellow-500 font-semibold">
                            ⭐ ${v.rating}
                        </span>
                    </div>

                    <div class="mt-3 flex justify-between text-sm">

                        <span class="text-red-500">
                            ${v.discountPercentage}% OFF
                        </span>

                        <span class="text-blue-600">
                            Stock: ${v.stock}
                        </span>

                    </div>

                    <div class="mt-4 flex flex-wrap gap-2">

                        ${v.tags.map(tag=>`
                            <span class="bg-gray-200 px-2 py-1 rounded text-xs">
                                ${tag}
                            </span>
                        `).join("")}

                    </div>

                    <button class="w-full mt-5 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg">
                        ${v.brand}
                    </button>

                </div>

            </div>

            `;
        });

        $("#product-table").html(result);

    }
})

</script>

</body>
</html>
