<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-gray-100">

<div class="max-w-6xl mx-auto py-10">

   <h1 class="text-5xl font-bold text-center text-indigo-700 mb-10">
   <i class="fa-brands fa-opencart"></i>
    Shopping Cart
</h1>

    <div id="cartItems"
         class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
    <div class="mt-8 text-right">
    <h2 id="total" class="text-3xl font-bold text-green-600"></h2>

    <div class="text-right mt-4">
    <button id="checkoutBtn"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg">
         <i class="fa-solid fa-credit-card"></i> Proceed to Checkout
    </button>
</div>
</div>


</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="./js/cart.js"></script>

</body>
</html>
