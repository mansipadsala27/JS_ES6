<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Document</title>
</head>
<body>
    <div class="budget-info">
        
        <div class="budget-part">
            <form>
                <label for="budget">Budget</label>
                <input id="setbudget_amount" type="text" placeholder="enetr total amount">
                <br>
                <button type="button" id="setBudget_btn">Set Budget</button>
            </form>
        </div>

        <div class="expense-part">
            <label for="expense">Expense</label>
            <input type="hidden" id="editId" >
            <input type="text" id="expense_title" placeholder="enter the expense">
            <br>
            <input type="text" id="expense_amount" placeholder="enter the expense amount">
            <br>
            <button id="addExpense_btn">Check Amount</button>
            <button id="updateExpense_btn">Update expense</button>
        </div>

    </div>
        

    <div class="expense-calculation-table">
        
        <table width="40%">
            <thead>
                <tr>
                    <th>Total Budget</th>
                    <th>Expense</th>
                    <th>balance</th>
                </tr>
            </thead>
            <tbody id="budget_record">
                <tr>
                    <td id="totalBudget_Display"></td>
                    <td id="expense_Display"></td>
                    <td id="balance_Display"></td>
                </tr>
            </tbody>
        </table>

    </div>

    
    <div class="expenselist">
        <h2>Expense List</h3>

        <table width="40%">
            <tbody id="expenseList">
                
            </tbody>
        </table>
    </div>

    <script>

let budget = 0;
let totalExpense = 0;
let balance = 0;
let expenses = JSON.parse(localStorage.getItem('expenses')) || []

const setbudget_amount = document.getElementById('setbudget_amount');
const setBudget_btn = document.getElementById('setBudget_btn');

const expense_title = document.getElementById('expense_title');
const expense_amount = document.getElementById('expense_amount');
const addExpense_btn = document.getElementById('addExpense_btn');

const totalBudget_Display = document.getElementById('totalBudget_Display');
const expense_Display = document.getElementById('expense_Display');
const balance_Display = document.getElementById('balance_Display');

const updateExpense_btn = document.getElementById('updateExpense_btn');
const editId = document.getElementById('editId');

setBudget_btn.addEventListener("click",() => {
    let value = setbudget_amount.value;

    if(value === "" || value <= 0 || isNaN(value)){
        alert("please enter the valid input...");
        return;
    }
    budget = Number(value);

    localStorage.setItem("budget",budget);

    document.getElementById("setbudget_amount").value = "";
    totalBudget();

    // updateUI();
})



let totalBudget = () => {
    let total_budget = JSON.parse(localStorage.getItem('budget'));
    document.getElementById('totalBudget_Display').innerHTML = total_budget;
    return total_budget;
}
totalBudget()



const viewExpense = () =>{
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

    let row = "";

    expenses.map((val,index)=>{
        row += `        
                    <tr>
                        <td width="0.7%" style="background-color:#007bff;"></td>
                        <td>${val.title}</td>
                        <td>${val.amount}</td>
                        <td width="5%">
                                <i class="fa-solid fa-pen-to-square" style="color:green" onclick="editExpense(${val.id})"></i> 
                        </td>
                        <td width="5%">
                            <i class="fa-solid fa-trash-can" style="color:red" onclick="deleteExpense(${val.id})"></i>
                        </td>
                    </tr>
                `
    })

    document.getElementById('expenseList').innerHTML = row;

}
viewExpense();
// updateUI();


addExpense_btn.addEventListener("click",() => {

    let expenses = JSON.parse(localStorage.getItem('expenses')) || []
    budget = Number(localStorage.getItem("budget"));

    let title = expense_title.value;

    let amount = Number(expense_amount.value);

    if(title === "" || isNaN(amount) ||amount === "" || amount <= 0){
        alert("please enter the valid input...");
        return;
    }

    let totalExpense = expenses.reduce((sum,item) =>{
        return sum + item.amount;
    },0);

    if(totalExpense + amount > budget ){
        alert("Budget exceeded!");
        return;
    }

    const expense = {
        id : Date.now(),
        title : title,
        amount:amount
    }

    expenses.push(expense);

    localStorage.setItem("expenses",JSON.stringify(expenses));

    document.getElementById("expense_title").value = "";
    document.getElementById("expense_amount").value = "";
    viewExpense();
    updateUI();
    // updateUI();

})

let updateUI = () => {

    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

    budget = Number(localStorage.getItem("budget"));

    totalExpense = expenses.reduce((sum,item) => {
        return sum + Number(item.amount);
    },0);
  
    console.log(totalExpense);
    
    balance = budget - totalExpense;

    totalBudget_Display.textContent = budget;
    expense_Display.textContent = totalExpense;
    balance_Display.textContent = balance;


}


const deleteExpense = (id) =>{
    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
    
    expenses = expenses.filter((item) => {
        return item.id !== id;
    });

    localStorage.setItem("expenses", JSON.stringify(expenses));
    viewExpense();
    updateUI();

}


const editExpense = (id) => {
    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
     
    let expense = expenses.find((item) => {
        return item.id === id;
    })
    // console.log(expense);

    expense_title.value = expense.title;
    expense_amount.value = expense.amount;

    document.getElementById("editId").value = expense.id;

    addExpense_btn.style.display = "none";
    updateExpense_btn.style.display = "block";
    
}


updateExpense_btn.addEventListener("click",() => {

    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

    let editId = Number(document.getElementById("editId").value);

   

    expenses.forEach((item) => {

        item = expenses[1];
        console.log(item);
        
        if (item.id === editId) {
            item.title = expense_title.value;
            item.amount = Number(expense_amount.value);
        }
    });

    localStorage.setItem("expenses", JSON.stringify(expenses));

    expense_title.value = "";
    expense_amount.value = "";
    document.getElementById("editId").value = "";

    addExpense_btn.style.display = "block";
    updateExpense_btn.style.display = "none";

    viewExpense();
    updateUI(); 


})

    </script>
</body>
</html>
