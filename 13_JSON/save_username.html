<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{

           margin: 0 auto;
           width:100%;
           height: 100vh;
           display: flex;
           justify-content: center;
           align-items: center; 
           background-color: rgb(239, 236, 233);
        }

        .box{
            border-radius: 10px;
            text-align: center;
            background-color: rgb(182, 177, 177);
            padding: 22px 30px;
            box-shadow: 5px 5px 12px rgb(93, 84, 72);;
        }
        input{
            margin: 10px 0px;
            border-radius: 5px;
            /* width: 100%; */
            display:block;
            padding: 5px 8px;

        }
        input:focus{
            border-color: none;
            border:1px solid rgb(220, 145, 53);;
        }
        label{

            font-size: 24px;
        }
        button{
            border: none;
            background-color: rgb(220, 145, 53);
            font-size: 18px;
            border-radius:8px;
            padding: 8px 16px;
            transition: 0.2s;
        }
        button:hover{
            transform: translateY(2px);
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="box">
            <label for="name">Enter user name: </label>
            <input id="name">
            <button id="saveBtn">Save</button>

        </div>    
    </div>
    
    <script>

        let saveBtn=document.getElementById('saveBtn')

        saveBtn.addEventListener('click',()=>{
            let name=document.getElementById('name').value
            
            if(name!==""){
            
                localStorage.setItem("username",name)
                alert("username stored succefullyy... in local storage!")
                
                let getname=localStorage.getItem("username")
                console.log(getname);
                

            }
            else{
                alert("please enter valid user name ")
            }
            

            

        })
    </script>
</body>
</html>
