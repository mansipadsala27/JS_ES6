<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
        
        .container{
            width: 90%;
            margin: 0 auto;

        }
               
        .boxes{
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: flex-start;
            gap: 40px;               /* Space between boxes */
            margin-top: 30px;
            flex-wrap: wrap;
        }
            
        
    
            
        .budget-box{
            border-radius: 16px;
            padding: 24px 48px;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.2);
            margin: 0;
        }
        
       
        .budget-box p{
            font-weight: 600    ;
            font-size: 24px;

        }
        .budget-box input{
            font-size: 16px;
            border-radius: 5px;
            padding: 10px 12px;
            display: block;
            margin: 20px 0px;
        }
        .budget-box button{
            border: none;
            background-color: rgb(49, 17, 226);
            color: white;
            font-size: 16px;
            padding: 10px 12px;
            border-radius: 4px;
            margin: 20px 0px;

        }

        
       
       .expenses-box{
            border-radius: 16px;
            padding: 24px 48px;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.2);
            margin: 0;
        }

        .expenses-box p{
            font-weight: 600    ;
            font-size: 24px;

        }
        .expenses-box input{
            font-size: 16px;
            border-radius: 5px;
            padding: 8px 12px;
            display: block;
            margin: 8px 0px;
        }
        .expenses-box button{
            border: none;
            background-color: rgb(49, 17, 226);
            color: white;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 4px;
            margin: 8px 0px;

        }

        .total-balance{
            width: 55%;
            margin: 40px auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.2);
        }

        .total-balance table{
            border-radius: 5px;
            padding: 16px;
             background-color: rgb(49, 17, 226);
            color: aliceblue;
            text-align: center;
        }
       
        .expenses-table{
            box-shadow: 5px 5px 20px rgba(0,0,0,0.2);
            width: 55%;
            border-radius: 8px;
            margin: 20px auto;
        }
        .expenses-table p{
            font-size: 22px;
            font-weight: 600;
            padding: 8px 20px;
            margin: 4px 16px;

        }
        .expenses-table table{
            border-radius: 8px;
            padding: 16px;
            text-align: center;
         }
         .expenses-table button{
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            color: navy;
        }

        .expenses-table button i{
            color: navy;
        }
         .expenses-table table button i{
           
            height: 20px;
            width: 20px;
         }

    </style>

        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

    </head>
    <body>
        <div class="container">
            <div class="boxes">
                <div class="budget-box">
                    <p>Budget</p>
                    <input  id="setbudget_amount" type="text" placeholder="Enter total Amount">
                    <button id="budget_btn">Set Budget</button>
                </div>

                <div class="expenses-box">
                    <input type="hidden" id="editId">
                    <p>Expenses</p>
                    <input id="expense_title" type="text" placeholder="Enter expense">
                    <input id="expense_amount" type="text" placeholder="Enter expense Amount">
                    <button id="expense_btn">check Amount</button>
                </div>
            </div>

            <div class="total-balance">
                <table width="100%" id="table1">
                    <thead>
                        <tr>
                            <th>Total Budget</th>
                            <th>Expenses</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="totalbalance_display">0</td>
                            <td id="expense_display">0</td>
                            <td id="balance_display">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="expenses-table">
                <p>Expenses List</p>
                <table width="100%">
                    <tbody id="expenses_list">
                        
                    </tbody>
                </table>
            </div>

        </div>

        <script>
            
            let budget = 0;
            let totalExpense = 0;
            let balance = 0;

            let expenses = JSON.parse(localStorage.getItem('expenses')) || []

            let setbudget_amount=document.getElementById('setbudget_amount')
            let budget_btn=document.getElementById('budget_btn')
            
            let expense_title=document.getElementById('expense_title')
            let expense_amount=document.getElementById('expense_amount')
            let expense_btn=document.getElementById('expense_btn')

            let totalbalance_display=document.getElementById('totalbalance_display')
            let expense_display=document.getElementById('expense_display')
            let balance_display=document.getElementById('balance_display')
            
            budget_btn.addEventListener('click',()=>{
                let value=setbudget_amount.value
                if(value=="" || value <=0 || isNaN(value)){
                    alert('please enter the valid input...')
                    return; 
                }
                
                budget = Number(value);


                localStorage.setItem('budget',budget)
                setbudget_amount.value=""
                totalBudget();

            })

                let totalBudget = () => {
               

                    let total_budget = JSON.parse(localStorage.getItem('budget'));
                    totalbalance_display.textContent=budget
                    
                    return total_budget;
                }
                totalBudget()

            expense_btn.addEventListener('click',()=>{
                
             let expenses = JSON.parse(localStorage.getItem('expenses')) || []
             let budget= Number( localStorage.getItem('budget'))

                let exp_title=expense_title.value
                let exp_amt = Number(expense_amount.value);   
                let editId = document.getElementById("editId").value;           
                
                // let exp_list=document.getElementById('expenses_list')
                
                 if(exp_title === "" || isNaN(exp_amt) ||exp_amt === "" || exp_amt <= 0){
                    alert("please enter the valid input...");
                    return;
                }

                let totalExpense = expenses.reduce((sum,item) =>{
                    return sum + Number(item.amount);
                },0);
                // expense_display.textContent=totalExpense

                if(editId){

                    let oldExpense = expenses.find(item => item.id == editId);

                    totalExpense = totalExpense - Number(oldExpense.amount);

                }

                if(totalExpense + exp_amt > budget){
                    alert("Budget exceeded!");
                    return;
                }

                if(editId==""){

                const expense={
                    id:Date.now(),
                    title:exp_title,
                    amount:exp_amt
                }

                expenses.push(expense);

            }
            else{

                expenses = expenses.map(item=>{

                    if(item.id==editId){

                        return{
                            id:item.id,
                            title:exp_title,
                            amount:exp_amt
                        }

                    }

                    return item;

                });

                document.getElementById("editId").value="";
                expense_btn.textContent="check Amount";
            }

            localStorage.setItem("expenses", JSON.stringify(expenses));
                
                expense_title.value=""
                expense_amount.value=""
                viewexpense()
                
            })

          function viewexpense() {

            let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

            let row = "";

            let totalExpense = expenses.reduce((sum, item) => {
                return sum + Number(item.amount);
            }, 0);

            expense_display.textContent = totalExpense;

            let budget = Number(localStorage.getItem("budget"));
            balance_display.textContent = budget - totalExpense;

            expenses.forEach((val) => {
                row += `
                <tr>
                    <td>${val.title}</td>
                    <td>${val.amount}</td>
                    <td width="15%">
                        <button><i class="fa-solid fa-trash" onclick="deleteexpense(${val.id})"></i></button>
                    </td>
                    <td width="15%">
                        <button><i class="fa-solid fa-pen-to-square" onclick="editexpense(${val.id})"></i></button>
                    </td>
                </tr>`;
            });

            expenses_list.innerHTML = row;
        }
        viewexpense()

        const deleteexpense=(id)=>{
             let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
    
            expenses = expenses.filter((item) => {
                return item.id !== id;
            });

            localStorage.setItem("expenses", JSON.stringify(expenses));
            viewexpense();
        }

        const editexpense=(id)=>{
                let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
                

                let expense = expenses.find((item) => {
                    return item.id === id;
                })
                // console.log(expense);

                expense_title.value = expense.title;
                expense_amount.value = expense.amount;

                document.getElementById("editId").value = expense.id;
                expense_btn.textContent = "Update Expense"; 
        }




        </script>
    </body>
</html>
